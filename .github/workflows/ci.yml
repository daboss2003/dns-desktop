name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The engine is a separate repository, so this repository's CI cannot know
    # that a change there broke the application. A daily build against the
    # engine's main branch closes most of that gap; it reports after the fact
    # rather than on the pull request, which is the cost ADR 0015 records.
    - cron: '0 7 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform with a backend runs the tests. A platform whose code
        # only ever cross-compiles is a platform whose code does not work, and
        # leaving Windows out of this list is how it came to be treated as one
        # that did not matter.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # WebKitGTK is what the window is on Linux. macOS and Windows have
      # theirs in the operating system.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # The desktop build, natively. A shell that only ever cross-compiles is a
      # shell nobody has proved opens a window.
      - run: go build ./cmd/gatewaydns-desktop

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: linux,   goarch: arm}
          - {goos: darwin,  goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The headless build is what cross-compiles: no window, no CGO, one
      # static file for a Raspberry Pi or a container. The desktop build links
      # against the platform's own webview and is built natively by the test
      # job on each operating system, which is why every platform with a
      # backend is in that matrix.
      - run: CGO_ENABLED=0 go build -tags nogui ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  fuzz:
    name: Fuzz the wire codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Short, because this runs on every pull request. It is a smoke test that
      # the seed corpus still passes and the target still builds, not a hunt.
      - run: go test -run=XXX -fuzz=FuzzUnpack -fuzztime=60s ./internal/dhcp/

  release-check:
    name: No development replace directive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: go.mod must not contain a replace directive on a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -qE '^[[:space:]]*replace' go.mod; then
            echo "::error file=go.mod::remove the replace directive before tagging a release"
            grep -nE '^[[:space:]]*replace' go.mod
            exit 1
          fi
