name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The engine is a separate repository, so this repository's CI cannot know
    # that a change there broke the application. A daily build against the
    # engine's main branch closes most of that gap; it reports after the fact
    # rather than on the pull request, which is the cost ADR 0015 records.
    - cron: '0 7 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash on every runner, Windows included. The default there is PowerShell,
    # which parsed `go test -coverprofile=coverage.out ./...` into an argument
    # list containing a package called ".out" — a failure with nothing to do
    # with the code under test. The engine's workflow has always set this; these
    # two were written without it.
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform with a backend runs the tests. A platform whose code
        # only ever cross-compiles is a platform whose code does not work, and
        # leaving Windows out of this list is how it came to be treated as one
        # that did not matter.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # Tested without the window.
      #
      # The GUI shell is one file behind a build tag, it has no tests, and its
      # correctness is whether it compiles and opens a window — which the
      # desktop-build job below checks on the platforms that can. Requiring a
      # webview toolkit here would make every test on every platform depend on
      # a C library that is not needed to run any of them.
      - run: go vet -tags nogui ./...
      - run: go test -race -tags nogui -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 of golangci-lint, matching the `version: "2"` schema in
          # .golangci.yml. The action manages its own cache.
          version: latest
          # Without the window, for the reason given in the test job: the
          # linter would otherwise need a C toolkit to parse a file it has
          # nothing to say about.
          args: --timeout=5m --build-tags=nogui

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: linux,   goarch: arm}
          - {goos: darwin,  goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The headless build is what cross-compiles: no window, no CGO, one
      # static file for a Raspberry Pi or a container. The desktop build links
      # against the platform's own webview and is built natively by the test
      # job on each operating system, which is why every platform with a
      # backend is in that matrix.
      - run: CGO_ENABLED=0 go build -tags nogui ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the supported Linux target, because webview_go pins
        # pkg-config to webkit2gtk-4.0 and 22.04 certainly carries it.
        #
        # ubuntu-latest is here as a PROBE and is allowed to fail. Whether a
        # current Ubuntu still provides 4.0 is a question worth having answered
        # by a build rather than by me asserting it in a README, and the day it
        # starts passing is the day the pin above can go.
        os: [macos-latest, windows-latest, ubuntu-22.04, ubuntu-latest]
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev
      # The real thing: a window and a menu-bar item, linked against the
      # platform's own webview. A shell that only ever cross-compiles is a
      # shell nobody has proved opens a window.
      - run: go build ./cmd/gatewaydns-desktop

  fuzz:
    name: Fuzz the wire codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Short, because this runs on every pull request. It is a smoke test that
      # the seed corpus still passes and the target still builds, not a hunt.
      - run: go test -run=XXX -fuzz=FuzzUnpack -fuzztime=60s ./internal/dhcp/

  release-check:
    name: No development replace directive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: go.mod must not contain a replace directive on a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -qE '^[[:space:]]*replace' go.mod; then
            echo "::error file=go.mod::remove the replace directive before tagging a release"
            grep -nE '^[[:space:]]*replace' go.mod
            exit 1
          fi
